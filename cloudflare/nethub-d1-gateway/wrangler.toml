name = "techx-shude-mood-d1-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
ALLOW_IN_MEMORY_REPLAY = "false"

[[durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

[[migrations]]
tag = "replay-guard-v1"
new_sqlite_classes = ["ReplayGuard"]

[[d1_databases]]
binding = "DB"
database_name = "techx-shude-mood-d1"
database_id = "a53fa843-9dce-4446-9db5-b7e8096b86a3"