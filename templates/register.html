{% extends "base.html" %}

{% block title %}注册 - TechX心情晴雨表{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
<main class="auth-wrap">
  <section class="auth-card">
    <div class="auth-visual" aria-hidden="true"></div>
    <div class="auth-panel">
      <a class="brand" href="{{ url_for('login') }}">TechX心情晴雨表</a>
      <div class="auth-heading">
        <p class="eyebrow">创建学生账户</p>
        <h1>注册账户</h1>
      </div>

      {% include "_flash.html" %}

      <form
        class="form-stack"
        id="register-form"
        method="post"
        action="{{ url_for('register') }}"
        data-consent-dialog="register-privacy-consent-dialog"
      >
        <label>
          <span>姓名</span>
          <input name="real_name" autocomplete="name" required>
        </label>
        <label>
          <span>昵称</span>
          <input name="nickname" autocomplete="username" required>
        </label>
        <label>
          <span>年级（选填）</span>
          <select name="grade">
            <option value="">不设置</option>
            {% for grade in grades %}
              <option value="{{ grade }}">{{ grade }}级</option>
            {% endfor %}
          </select>
        </label>
        <label>
          <span>项目（选填）</span>
          <select name="program">
            <option value="">不设置</option>
            {% for program in programs %}
              <option value="{{ program }}">{{ program }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <input name="privacy_consent" type="hidden" value="">
        <button class="primary-button" type="submit">注册并进入</button>
      </form>

      <p class="auth-switch">已经有账户？<a href="{{ url_for('login') }}">返回登录</a></p>
    </div>
  </section>
</main>

<dialog
  class="modal consent-modal"
  id="register-privacy-consent-dialog"
  aria-labelledby="register-privacy-consent-title"
>
  <div class="modal-header">
    <h2 id="register-privacy-consent-title">&#38544;&#31169;&#35268;&#21017;&#30830;&#35748;</h2>
    <button class="modal-close" type="button" data-modal-close aria-label="&#20851;&#38381;">&#215;</button>
  </div>
  <div class="settings-form modal-form">
    {% include "_privacy_consent_notice.html" %}
    <label class="consent-check">
      <input name="privacy_consent" type="checkbox" value="yes" required>
      <span>&#25105;&#24050;&#30693;&#24713;&#24182;&#21516;&#24847;</span>
    </label>
    <div class="modal-actions">
      <button class="ghost-button compact-action" type="button" data-modal-close>&#21462;&#28040;</button>
      <button
        class="primary-button compact"
        type="button"
        data-consent-confirm="register-form"
      >
        &#21516;&#24847;&#24182;&#27880;&#20876;
      </button>
    </div>
  </div>
</dialog>
{% endblock %}
