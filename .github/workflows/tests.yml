name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m ruff check --select E9,F63,F7,F82,I main.py techx_auth.py scripts/apply_auth_mapping.py tests
      - run: python -m compileall -q main.py techx_auth.py scripts
      - run: bash -n deploy-first-run.sh
      - run: python -m pytest -q --basetemp data/.pytest-ci -p no:cacheprovider
